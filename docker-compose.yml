services:
  cue-sheet:
    build: .
    image: cue-sheet:latest
    container_name: cue-sheet
    ports:
      - "8080:8080"
    environment:
      # 宿主机端口如需修改，改左侧即可；容器内端口由 PORT 控制
      PORT: "8080"
      DB_PATH: /app/data/cue-sheet.sqlite
      STATIC_DIR: /app/web/dist
      # 首次启动且库中无场次时，是否插入一个示例空场次
      SEED_SAMPLE: "true"
    volumes:
      - cue-sheet-data:/app/data
    restart: unless-stopped

volumes:
  cue-sheet-data:
